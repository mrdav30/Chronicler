name: build-and-test

on:
  push:
    branches-ignore:
      - "dependabot/**"
      - "gh-pages"
    tags-ignore:
      - "v*"
  pull_request:
    branches:
      - "main"
      - "develop"

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        configuration: [Release, ReleaseLean]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: |
            10.0.x

      - name: Setup GitVersion
        uses: gittools/actions/gitversion/setup@v4
        with:
          versionSpec: "6.4.x"

      - name: Execute GitVersion
        id: gitversion
        uses: gittools/actions/gitversion/execute@v4

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ matrix.configuration }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.configuration }}-nuget-
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: dotnet restore Chronicler.slnx --property:Configuration=${{ matrix.configuration }}

      - name: Build Solution
        run: |
          echo "Version: ${{ steps.gitversion.outputs.fullSemVer }}"
          echo "Assembly Version: ${{ steps.gitversion.outputs.assemblySemFileVer }}"
          dotnet build Chronicler.slnx --configuration ${{ matrix.configuration }} --no-restore

      - name: Run Tests with Coverage
        shell: pwsh
        run: |
          dotnet test tests/Chronicler.Tests/Chronicler.Tests.csproj --configuration ${{ matrix.configuration }} --no-build --no-restore --verbosity normal --collect:"XPlat Code Coverage" --settings tests/Chronicler.Tests/coverlet.runsettings --results-directory artifacts/coverage/core -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[Chronicler]*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Chronicler.Diagnostics.Tests/Chronicler.Diagnostics.Tests.csproj --configuration ${{ matrix.configuration }} --no-build --no-restore --verbosity normal --collect:"XPlat Code Coverage" --settings tests/Chronicler.Tests/coverlet.runsettings --results-directory artifacts/coverage/diagnostics -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[Chronicler.Diagnostics]*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test tests/Chronicler.MemoryPackShim.Tests/Chronicler.MemoryPackShim.Tests.csproj --configuration ${{ matrix.configuration }} --no-build --no-restore --verbosity normal --collect:"XPlat Code Coverage" --settings tests/Chronicler.Tests/coverlet.runsettings --results-directory artifacts/coverage/shim -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Include="[Chronicler.MemoryPackShim]*"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Enforce Full Coverage
        shell: pwsh
        run: ./.assets/scripts/assert-full-coverage.ps1 -CoverageDirectory artifacts/coverage
